<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rút thẻ — demo 5</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#faf7f0; --card:#fff; --border:#e7e1d6; --text:#1c1917; --muted:#6b6259; --primary:#0f766e; --accent:#f5b82e; --brand:#dc2f26;
    --common:#8a8f98; --rare:#16a34a; --epic:#7c3aed; --legendary:#dc2f26; --ancient:#d4a017; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Be Vietnam Pro',system-ui,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  h1 { font-size:26px; margin:4px 0 0; }
  .lead { color:var(--muted); margin:0; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; display:grid; gap:10px; }
  .step { font-size:12px; font-weight:800; color:var(--primary); letter-spacing:.5px; text-transform:uppercase; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .label { font-size:13px; font-weight:600; color:var(--muted); width:72px; }
  .chip { border:1px solid var(--border); background:var(--card); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-size:14px; }
  .chip.on { background:var(--primary); border-color:var(--primary); color:#fff; }
  .sub { font-size:13px; color:var(--muted); }
  select { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:#fff; }
  .table { container-type:inline-size; position:relative; height:400px; border-radius:16px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#a8713f 0%,#8a5a32 55%,#6f4626 100%); box-shadow:inset 0 0 0 6px #5b391e,inset 0 0 40px rgba(0,0,0,.35); }
  .felt { position:absolute; inset:24px; border-radius:12px; background:radial-gradient(ellipse at 50% 45%,#1a8a80,var(--primary) 70%,#0b5a54); box-shadow:inset 0 0 30px rgba(0,0,0,.35); }
  .hint { position:absolute; left:0; right:0; bottom:38px; text-align:center; color:#e6fffb; font-weight:600; font-size:14px; text-shadow:0 1px 2px rgba(0,0,0,.4); pointer-events:none; }
  .pcard { --w:min(110px, calc((100cqw - 88px) / 5.2)); position:absolute; width:var(--w); height:calc(var(--w)*1.6); left:50%; top:50%; margin:calc(var(--w)*-.8) 0 0 calc(var(--w)*-.5);
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s, filter .3s; cursor:default; }
  .pcard.pickable { cursor:pointer; }
  .pcard.pickable:hover { filter:brightness(1.08); }
  .face { position:absolute; inset:0; border-radius:10px; backface-visibility:hidden; overflow:hidden; display:flex; flex-direction:column; }
  .back { background:repeating-linear-gradient(45deg,var(--brand) 0 9px,#c8241c 9px 18px); border:3px solid #fff; box-shadow:0 6px 14px rgba(0,0,0,.35); align-items:center; justify-content:center; }
  .back b { background:#fff; color:var(--brand); border-radius:999px; padding:3px 6px; font-size:calc(var(--w) * .095); font-weight:800; white-space:nowrap; }
  .front { transform:rotateY(180deg); background:#fff; border:4px solid var(--rc); }
  .art { flex:0 0 auto; aspect-ratio:1; background:center/cover no-repeat var(--rc); }
  .meta { padding:calc(var(--w) * .05) calc(var(--w) * .06); }
  .meta .n { font-weight:800; font-size:calc(var(--w) * .105); line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta .r { font-weight:700; font-size:calc(var(--w) * .085); color:var(--rc); text-transform:uppercase; }
  .glow,.rays { position:absolute; left:50%; top:50%; pointer-events:none; }
  .glow { width:10px; height:10px; margin:-5px; border-radius:50%; opacity:0; }
  .rays i { position:absolute; left:-3px; top:-190px; width:6px; height:150px; border-radius:3px; transform-origin:3px 190px; background:linear-gradient(var(--rc),transparent); }
  .spark { position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:50%; background:var(--rc); pointer-events:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pop { 0% { opacity:0; transform:scale(.4); } 30% { opacity:1; } 100% { opacity:0; transform:scale(1.6); } }
  @keyframes sparkle { 0% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2); } }
  @keyframes shimmer { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.35); } }
  @keyframes breathe { 0%,100% { transform:var(--t) translateY(0); } 50% { transform:var(--t) translateY(-5px); } }
  .muck { position:absolute; right:34px; top:34px; color:#e6fffb; font-size:11px; font-weight:700; opacity:.8; }
  .deckLbl { position:absolute; left:34px; top:34px; color:#e6fffb; font-size:11px; font-weight:700; opacity:.8; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  .go { flex:1; background:var(--accent); color:var(--text); border:0; border-radius:12px; font:inherit; font-weight:800; font-size:18px; letter-spacing:1px; padding:14px; cursor:pointer; box-shadow:0 4px 0 #c28d10; }
  .go:disabled { opacity:.5; cursor:default; }
  .ghost { border:1px solid var(--primary); color:var(--primary); background:#fff; border-radius:12px; font:inherit; font-weight:700; padding:12px 16px; cursor:pointer; }
  .ghost:disabled { opacity:.4; cursor:default; }
  .result { display:none; }
  .result.on { display:grid; }
  .badge { display:inline-block; font-size:12px; font-weight:700; color:#fff; padding:3px 10px; border-radius:999px; background:var(--rc); }
  .btn { border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; border:1px solid var(--primary); background:#fff; color:var(--primary); }
  .btn.p { background:var(--primary); color:#fff; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

  .mute { width:52px; border:1px solid var(--border); background:#fff; border-radius:12px; font-size:20px; cursor:pointer; }
  .scrim { position:fixed; inset:0; background:rgba(28,25,23,.55); opacity:0; pointer-events:none; transition:opacity .25s; z-index:90; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; width:min(560px,100%); transform:translate(-50%,105%); transition:transform .35s cubic-bezier(.2,.8,.2,1);
    background:var(--card); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:100; display:grid; gap:12px; box-shadow:0 -10px 30px rgba(0,0,0,.25); border-top:6px solid var(--rc); }
  .sheet.on { transform:translate(-50%,0); }
  @media (min-width:700px) { .sheet { bottom:auto; top:50%; border-radius:20px; transform:translate(-50%,-40%) scale(.96); opacity:0; pointer-events:none; } .sheet.on { transform:translate(-50%,-50%); opacity:1; pointer-events:auto; } }
  .sheet .x { position:absolute; right:10px; top:10px; width:40px; height:40px; border-radius:50%; border:0; background:#f1ece2; font-size:18px; cursor:pointer; }
  .hero { display:flex; gap:14px; align-items:center; padding-right:40px; }
  .hero img { width:104px; height:104px; border-radius:12px; object-fit:cover; border:4px solid var(--rc); box-shadow:0 0 24px var(--rc); }
  .hero h3 { margin:6px 0 2px; font-size:22px; }
  .who { font-size:14px; background:#f1ece2; border-radius:10px; padding:10px 12px; }
  .cta { width:100%; border:0; border-radius:14px; padding:16px; font:inherit; font-weight:800; font-size:17px; color:#fff; background:var(--primary); box-shadow:0 4px 0 #0b5a54; cursor:pointer; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .sec { border:1px solid var(--primary); color:var(--primary); background:#fff; border-radius:12px; padding:12px; font:inherit; font-weight:700; cursor:pointer; display:flex; gap:6px; align-items:center; justify-content:center; }
  .again { border:0; background:var(--accent); color:var(--text); border-radius:12px; padding:12px; font:inherit; font-weight:800; cursor:pointer; box-shadow:0 3px 0 #c28d10; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div><h1>Hôm nay chơi gì?</h1><p class="lead">Demo 5 (âm thanh thật) · chọn nguồn → tráo bài → chia kiểu poker (huỷ 1 · flop 3 · huỷ 1 · turn · huỷ 1 · river) → chọn 1 lá.</p></div>

  <div class="box">
    <div class="step">Bước 1 · Rút từ đâu?</div>
    <div class="row" id="sources"></div>
    <div class="row" id="sourceDetail"></div>
    <div class="row"><span class="label">Số người</span><div class="row" id="players"></div></div>
    <div class="sub" id="poolInfo">Chọn nguồn để bắt đầu.</div>
  </div>

  <div class="table" id="table"><div class="felt"></div><div class="deckLbl">BỘ BÀI</div><div class="muck">BÀI HUỶ</div><div class="hint" id="hint"></div></div>

  <div class="actions">
    <button class="go" id="go" disabled>TRÁO BÀI</button>
    <button class="mute" id="mute" aria-label="Tắt tiếng" aria-pressed="false" title="Tắt tiếng">🔊</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="sub">Âm thanh: Kenney (CC0) + Pixabay.</div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="result" role="dialog" aria-modal="true" aria-label="Kết quả rút thẻ" aria-live="polite"></div>
</div>
<script>
const RARITY = [
  { label:'Thường', w:45, c:'var(--common)' }, { label:'Hiếm', w:28, c:'var(--rare)' }, { label:'Sử thi', w:15, c:'var(--epic)' },
  { label:'Huyền thoại', w:8, c:'var(--legendary)' }, { label:'Cổ vật', w:4, c:'var(--ancient)' },
];
const COVERS = {"Catan": {"img": "https://cf.geekdo-images.com/0XODRpReiZBFUffEcqT5-Q__square200/img/0YXkSunQYJYfi_YHi0k0mvFBrxM=/200x200/filters:strip_icc()/pic9156909.png", "info": "3–4 người · 90 phút · 2.3"}, "The Gang": {"img": "https://cf.geekdo-images.com/ydwU0FMlRVa6wt8tOu1tgg__square200/img/FZilVJcAeNbhanFocpuSKkGUz7k=/200x200/filters:strip_icc()/pic7962719.jpg", "info": "3–6 người · 30 phút · 1.5"}, "7 Wonders": {"img": "https://cf.geekdo-images.com/35h9Za_JvMMMtx_92kT0Jg__square200/img/OAOa83gHHv2eyNvWQBmBKcAQNIg=/200x200/filters:strip_icc()/pic7149798.jpg", "info": "3–7 người · 30 phút · 2.3"}, "Azul": {"img": "https://cf.geekdo-images.com/aPSHJO0d0XOpQR5X-wJonw__square200/img/3SujmcsLunL1xALI1xJzgbfDndE=/200x200/filters:strip_icc()/pic6973671.png", "info": "2–4 người · 45 phút · 1.8"}, "Splendor": {"img": "https://cf.geekdo-images.com/vNFe4JkhKAERzi4T0Ntwpw__square200/img/GwddOGnRbOKcppnaCyo-tC9yXIU=/200x200/filters:strip_icc()/pic8234167.png", "info": "2–4 người · 30 phút · 1.8"}, "Codenames": {"img": "https://cf.geekdo-images.com/nC6ifPCDnAItwoKSKXVrnw__square200/img/ZUa-6Wb_m1KmtkAb6MxmcVN6Y50=/200x200/filters:strip_icc()/pic8907965.jpg", "info": "2–8 người · 15 phút · 1.3"}, "Brass: Birmingham": {"img": "https://cf.geekdo-images.com/x3zxjr-Vw5iU4yDPg70Jgw__square200/img/dNf_NYkJhQ6h2K0zWxhzRmJfAg8=/200x200/filters:strip_icc()/pic3490053.jpg", "info": "2–4 người · 120 phút · 3.9"}, "Wingspan": {"img": "https://cf.geekdo-images.com/yLZJCVLlIx4c7eJEWUNJ7w__square200/img/BuUGdo8iEnHLPKZvyttszIdBNOU=/200x200/filters:strip_icc()/pic4458123.jpg", "info": "1–5 người · 70 phút · 2.5"}, "Ma Sói": {"img": "https://cf.geekdo-images.com/dbKLvMw--0rTKU5ShvZ79A__square200/img/UusjX8q2AnURSgUmqY8M5RTP3j8=/200x200/filters:strip_icc()/pic2453810.jpg", "info": "6–18 người · 30 phút · 1.4"}, "Dune: Imperium": {"img": "https://cf.geekdo-images.com/PhjygpWSo-0labGrPBMyyg__square200/img/XQE1cgfiOiXKN_jYpPpnxKPPXTI=/200x200/filters:strip_icc()/pic5666597.jpg", "info": "1–4 người · 120 phút · 3.0"}};
const GAMES = Object.entries(COVERS).map(([name, v]) => ({ name, info: v.info, img: v.img }));
const SOURCES = {
  'Tủ game của tôi': { detail: null, pool: 'Tủ game của bạn: 24 game', who: 'Game trong tủ của bạn · rủ bạn bè qua chơi hoặc mang ra quán.' },
  'Club': { detail: ['Saigon Boardgame Club', 'CLB Test Local'], pool: 'Tủ game của club: 58 game', who: 'Thành viên có game: <b>Minh Anh</b>, <b>Quang Huy</b>.' },
  'Nhóm bạn': { detail: ['Bạn bè của tôi', 'Nhóm "Thứ 6 chơi game"'], pool: 'Tủ game của 9 người bạn: 112 game', who: '<b>Thảo Vy</b> và <b>Đức Mạnh</b> có game này.' },
  'Quán': { detail: ['Dice & Dragons Café, Q.1', 'Meeple Station, Q.3'], pool: 'Tủ game của quán: 340 game', who: 'Quán đang có game này trong tủ.' },
  'Cùng thành phố': { detail: ['TP. Hồ Chí Minh', 'Hà Nội', 'Đà Nẵng'], pool: 'Game có ở quán và người chơi trong thành phố: 870 game', who: '6 quán và 11 người chơi trong thành phố có game này.' },
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s) => document.querySelector(s);
const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
let source = null, busy = false, dealt = [];

function chips(el, items, first, onPick) {
  el.innerHTML = '';
  items.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'chip' + (first && i === 0 ? ' on' : ''); b.textContent = t;
    b.onclick = () => { [...el.children].forEach((c) => c.classList.remove('on')); b.classList.add('on'); onPick?.(t); };
    el.appendChild(b);
  });
}
chips($('#sources'), Object.keys(SOURCES), false, (s) => {
  source = s; const d = SOURCES[s];
  $('#sourceDetail').innerHTML = d.detail ? `<select aria-label="Chọn ${s.toLowerCase()}">${d.detail.map((x) => `<option>${x}</option>`).join('')}</select>` : '';
  $('#poolInfo').textContent = d.pool; $('#go').disabled = false; $('#go').textContent = 'TRÁO BÀI'; setHint('Bấm TRÁO BÀI'); closeSheet(); resetTable();
});
chips($('#players'), ['Bất kỳ', '2', '3', '4', '5', '6+'], true);
$('#legend').innerHTML = RARITY.map((r) => `<span><i style="background:${r.c}"></i>${r.label}</span>`).join('');
const setHint = (t) => ($('#hint').textContent = t);
setHint('Chọn nguồn ở bước 1 trước');

const SFX = { riffle: 'riffle', bridge: 'riffle', deal: 'deal', burn: 'burn', lift: null, suspense: 'suspense', flip: 'flip', reveal: 'reveal' };
let ac, muted = false; const buffers = {};
const actx = () => (ac ??= new (window.AudioContext || window.webkitAudioContext)());
async function loadSfx() {
  await Promise.all([...new Set(Object.values(SFX).filter(Boolean))].map(async (k) => {
    const data = await (await fetch(`sfx/chosen/${k}.mp3`)).arrayBuffer();
    buffers[k] = await actx().decodeAudioData(data);
  }));
}
const loading = loadSfx();
function playSfx(ev, { gain = 1, rate = 1 } = {}) {
  const k = SFX[ev], b = k && buffers[k];
  if (!b) return 0;
  if (!muted) {
    const a = actx(); if (a.state === 'suspended') a.resume();
    const src = a.createBufferSource(), g = a.createGain(); src.buffer = b; src.playbackRate.value = rate; g.gain.value = gain;
    src.connect(g).connect(a.destination); src.start();
  }
  return b.duration / rate;
}
const sfx = {
  riffle: () => playSfx('riffle'), bridge: () => playSfx('bridge', { gain: .6, rate: 1.15 }),
  deal: () => playSfx('deal'), burn: () => playSfx('burn', { gain: .8 }), lift: () => 0,
  suspense: () => playSfx('suspense'), flip: () => playSfx('flip'),
  reveal: (lvl) => playSfx('reveal', { gain: .6 + lvl * .1 }),
};
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; $('#mute').setAttribute('aria-pressed', muted); $('#mute').setAttribute('aria-label', muted ? 'Bật tiếng' : 'Tắt tiếng'); };

function pick() {
  const total = RARITY.reduce((a, r) => a + r.w, 0); let x = Math.random() * total;
  const r = RARITY.find((q) => (x -= q.w) < 0) ?? RARITY[0];
  return { r, lvl: RARITY.indexOf(r), ...GAMES[Math.floor(Math.random() * GAMES.length)] };
}
function cardW() { return Math.min(110, Math.floor(($('#table').clientWidth - 48 - 4 * 10) / 5.2)); }
function cardEl(res, w) {
  const c = document.createElement('div'); c.className = 'pcard'; c.style.setProperty('--rc', res.r.c);
  c.innerHTML = `<div class="face back"><b>OnBoardVN</b></div><div class="face front"><div class="art" style="background-image:url('${res.img}')"></div>
    <div class="meta"><div class="n">${res.name}</div><div class="r">${res.r.label}</div></div></div>`;
  return c;
}
function fillFront(c, res) {
  c.style.setProperty('--rc', res.r.c);
  c.querySelector('.art').style.backgroundImage = `url('${res.img}')`;
  c.querySelector('.n').textContent = res.name; c.querySelector('.r').textContent = res.r.label;
}
function resetTable() { $('#table').querySelectorAll('.pcard,.glow,.rays,.spark').forEach((e) => e.remove()); dealt = []; }
function closeSheet() { $('#result').classList.remove('on'); $('#scrim').classList.remove('on'); }
function burst(res) {
  const t = $('#table'); t.style.setProperty('--rc', res.r.c);
  if (res.lvl >= 1) { const g = document.createElement('div'); g.className = 'glow'; g.style.cssText += `top:44%;box-shadow:0 0 ${60 + res.lvl * 40}px ${30 + res.lvl * 25}px ${res.r.c};animation:pop ${1.2 + res.lvl * .3}s ease-out forwards`; t.appendChild(g); }
  if (res.lvl >= 2) { const r = document.createElement('div'); r.className = 'rays'; r.style.top = '44%';
    r.innerHTML = Array.from({ length: 12 }, (_, i) => `<i style="transform:rotate(${i * 30}deg)"></i>`).join(''); r.style.cssText += `opacity:.85;animation:spin ${8 - res.lvl}s linear infinite`; t.insertBefore(r, t.querySelector('.pcard')); }
  if (res.lvl >= 3) for (let i = 0; i < 18 + res.lvl * 6; i++) { const s = document.createElement('div'); s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 150; s.style.cssText = `top:44%;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;animation:sparkle ${.8 + Math.random() * .8}s ease-out ${Math.random() * .3}s forwards`; t.appendChild(s); }
}

async function shuffleAndDeal() {
  if (busy || !source) return; await loading; busy = true; closeSheet(); $('#go').disabled = true; resetTable(); setHint('Đang tráo bài…');
  const t = $('#table'), deck = [];
  const results = []; for (let tries = 0; results.length < 5 && tries < 200; tries++) { const r = pick(); if (!results.some((x) => x.name === r.name)) results.push(r); } while (results.length < 5) results.push(pick());
  const DECK = 'translate(-250%, -100%)';
  for (let i = 0; i < 11; i++) { const c = cardEl(results[i % 5], 0); c.style.transform = `translate(${-i}px,${-i * 1.2}px)`; c.style.zIndex = i; t.appendChild(c); deck.push(c); }
  await wait(150);
  for (let k = 0; k < 3; k++) {
    deck.forEach((c, i) => { const side = i % 2 ? 1 : -1; c.style.transform = `translate(calc(${side * 60}% + ${side * i * 2}px),${-i}px)`; });
    sfx.riffle(); await wait(380);
    deck.forEach((c, i) => { c.style.transform = `translate(${-i * .5}px,${-i * 1.2}px)`; });
    sfx.bridge(); await wait(220);
  }
  deck.forEach((c, i) => { c.style.transform = `${DECK} translate(${-i * .5}px,${-i * 1.2}px) scale(.62)`; }); await wait(380);
  const slots = [-2, -1, 0, 1, 2].map((k) => `translate(calc(${k * 100}% + ${k * 12}px), 0)`);
  const pile = deck.slice(), take = () => pile.pop();
  let muck = 0;
  const burn = async () => { const c = take(); c.style.zIndex = 30; c.style.transform = `translate(calc(250% + ${muck * 3}px), calc(-100% + ${muck * 3}px)) scale(.62)`; muck++; sfx.burn(); await wait(330); };
  const dealTo = async (i) => { const c = take(); fillFront(c, results[i]); c.style.zIndex = 40 + i; c.style.transform = slots[i]; c.style.setProperty('--t', slots[i]); sfx.deal(); await wait(220); return c; };
  const dealtCards = [];
  setHint('Huỷ 1 lá…'); await burn();
  setHint('Flop'); for (let i = 0; i < 3; i++) dealtCards.push(await dealTo(i)); await wait(250);
  setHint('Huỷ 1 lá…'); await burn();
  setHint('Turn'); dealtCards.push(await dealTo(3)); await wait(250);
  setHint('Huỷ 1 lá…'); await burn();
  setHint('River'); dealtCards.push(await dealTo(4)); await wait(200);
  pile.forEach((c) => { c.style.opacity = 0; setTimeout(() => c.remove(), 300); });
  dealt = dealtCards.map((c, i) => ({ c, res: results[i] }));
  dealt.forEach(({ c, res }) => {
    c.classList.add('pickable'); c.setAttribute('role', 'button'); c.setAttribute('aria-label', 'Lật lá bài này'); c.tabIndex = 0;
    c.style.animation = reduce ? '' : `breathe 1.8s ease-in-out ${Math.random() * .8}s infinite`;
    const go = () => choose(c, res); c.onclick = go; c.onkeydown = (e) => (e.key === 'Enter' || e.key === ' ') && go();
  });
  setHint('Chọn 1 lá bài'); busy = false; $('#go').disabled = false; $('#go').textContent = 'TRÁO LẠI';
}

async function choose(card, res) {
  if (busy || !dealt.length) return; busy = true; setHint('');
  dealt.forEach(({ c }) => { c.classList.remove('pickable'); c.onclick = null; c.style.animation = ''; if (c !== card) c.querySelectorAll('.face').forEach((f) => { f.style.opacity = .45; f.style.filter = 'grayscale(.5)'; }); });
  card.style.zIndex = 60; card.style.transform = 'translate(0,-20px) scale(1.6)'; sfx.lift(); await wait(380);
  const dur = (sfx.suspense(res.lvl) || 1) * 1000 * .9;
  const n = 8 + res.lvl * 4, step = dur / n;
  for (let i = 0; i < n; i++) { card.style.transform = `translate(0,-20px) scale(${1.6 + i * .006}) rotate(${i % 2 ? 1.5 : -1.5}deg)`; await wait(step); }
  card.style.transform = 'translate(0,-20px) scale(1.7) rotateY(180deg)'; sfx.flip(); await wait(300);
  burst(res); sfx.reveal(res.lvl); if (res.lvl === 4) card.style.animation = 'shimmer .6s ease-in-out 4';
  await wait(450);
  dealt.forEach(({ c }) => { if (c !== card) c.style.transform += ' rotateY(180deg)'; });
  await wait(500); showResult(res); busy = false; $('#go').disabled = false;
}

function showResult(res) {
  const r = $('#result'), s = SOURCES[source]; r.style.setProperty('--rc', res.r.c);
  const actions = source === 'Quán'
    ? { cta: 'Tạo Kèo tại quán này', sec: ['Nhắn Zalo quán', 'Fanpage quán', 'Gọi quán', 'Muốn chơi'] }
    : source === 'Cùng thành phố'
      ? { cta: 'Xem quán & người có game', sec: ['Tạo Kèo', 'Muốn chơi'] }
      : { cta: 'Rủ chơi · Tạo Kèo', sec: ['Chọn quán để chơi', 'Muốn chơi'] };
  r.innerHTML = `<button class="x" aria-label="Đóng" onclick="closeSheet()">✕</button>
    <div class="hero"><img src="${res.img}" alt=""><div><span class="badge">${res.r.label}</span><h3>${res.name}</h3><div class="sub">${res.info}</div></div></div>
    <div class="who">${s.who}</div>
    <button class="cta">${actions.cta}</button>
    <div class="grid2">${actions.sec.map((t) => `<button class="sec">${t}</button>`).join('')}</div>
    <button class="again" onclick="closeSheet(); shuffleAndDeal()">TRÁO LẠI</button>
    <div class="sub" style="text-align:center">Đóng khung này để xem 4 lá bạn đã bỏ qua.</div>`;
  $('#scrim').classList.add('on'); r.classList.add('on'); r.querySelector('.cta').focus();
}
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeSheet());

$('#go').onclick = shuffleAndDeal;
GAMES.forEach((g) => { const i = new Image(); i.src = g.img; });
</script>
</body>
