name: onboard

networks:
  onboard:
    driver: bridge

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

x-api-image: &api-image ghcr.io/onboard-vn/api:${TAG:-latest}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    networks: [onboard]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-onboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-onboard} -d ${POSTGRES_DB:-onboard}']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: *api-image
    restart: 'no'
    mem_limit: 256m
    networks: [onboard]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      GAMEUPC_BASE_URL: ${GAMEUPC_BASE_URL:-}
      GAMEUPC_API_KEY: ${GAMEUPC_API_KEY:-}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      SHOW_EXTERNAL_METADATA: ${SHOW_EXTERNAL_METADATA:-false}
    command: ['node', 'dist/db/migrate.js']

  api:
    image: *api-image
    restart: unless-stopped
    mem_limit: 512m
    networks: [onboard]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      PORT: ${PORT:-8787}
      TRUST_PROXY: 'true'
    volumes:
      - uploads:${UPLOADS_DIR:-/data/uploads}

  web:
    image: ghcr.io/onboard-vn/web:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 512m
    networks: [onboard]
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:${PORT:-8787}
      SITE_URL: ${WEB_ORIGIN:?WEB_ORIGIN is required}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    networks: [onboard]
    depends_on:
      - web
      - api
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
