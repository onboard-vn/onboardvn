name: onboard-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: onboard
      POSTGRES_DB: onboard
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onboard -d onboard']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
