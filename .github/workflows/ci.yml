name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://onboard:onboard@localhost:54329/onboard_test

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onboard
          POSTGRES_PASSWORD: onboard
          POSTGRES_DB: onboard
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U onboard -d onboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3100
      WEB_ORIGIN: http://localhost:3100
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onboard
          POSTGRES_PASSWORD: onboard
          POSTGRES_DB: onboard
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U onboard -d onboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onboard/shared build
      - run: pnpm --filter @onboard/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://onboard:onboard@localhost:54329/onboard
      - run: pnpm db:seed-locations
        env:
          DATABASE_URL: postgres://onboard:onboard@localhost:54329/onboard
      - run: pnpm --filter @onboard/web test:e2e
        env:
          E2E_DATABASE_URL: postgres://onboard:onboard@localhost:54329/onboard
